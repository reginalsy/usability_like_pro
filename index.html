    <script>
      (function() {
        var suppress = function(e) {
          if (!e) return false;
          var msg = typeof e === 'string' ? e : (e.message || '');
          var file = (e && e.filename) || '';
          if (
            msg === 'Script error.' ||
            msg.indexOf('Script error') !== -1 ||
            file.indexOf('disqus') !== -1 ||
            file.indexOf('disquscdn') !== -1
          ) {
            if (e.preventDefault) e.preventDefault();
            if (e.stopImmediatePropagation) e.stopImmediatePropagation();
            return true;
          }
          return false;
        };
        window.addEventListener('error', suppress, true);
        var oldOnError = window.onerror;
        window.onerror = function(message, source, lineno, colno, error) {
          if (
            message === 'Script error.' ||
            (typeof message === 'string' && message.indexOf('Script error') !== -1) ||
            (source && (source.indexOf('disqus') !== -1 || source.indexOf('disquscdn') !== -1))
          ) {
            return true;
          }
          if (typeof oldOnError === 'function') {
            return oldOnError.apply(this, arguments);
          }
        };
        window.addEventListener('unhandledrejection', function(e) {
          var reason = '' + (e.reason && (e.reason.message || e.reason));
          if (reason.indexOf('disqus') !== -1 || reason.indexOf('Script error') !== -1) {
            e.preventDefault();
          }
        });
      })();
    </script>
